<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" font-family="'Segoe UI',Inter,system-ui,sans-serif" role="img" aria-label="SwiftX Settings - About, Logi hero-card format">
<title>SwiftX Settings - About, Logi hero-card format</title>
<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter></defs>
<rect width="700" height="500" fill="#141414"/>
<text x="32" y="48" font-size="22" font-weight="700" fill="#FFFFFF">About</text>
<rect x="32" y="76" width="636" height="220" rx="12" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
<rect x="74.0" y="128.0" width="36.1" height="36.1" rx="15.2" fill="#3DDCD3"/>
<rect x="113.9" y="128.0" width="36.1" height="36.1" rx="15.2" fill="#7B7BFF"/>
<rect x="74.0" y="167.9" width="36.1" height="36.1" rx="15.2" fill="#FF9F5A"/>
<rect x="113.9" y="167.9" width="36.1" height="36.1" rx="15.2" fill="#5AD1FF"/>
<text x="190" y="130" font-size="20" font-weight="700" fill="#FFFFFF">SwiftX</text>
<text x="190" y="152" font-size="12.5" font-weight="400" fill="#9A9A9A">Version 1.4.0</text>
<text x="190" y="176" font-size="12" font-weight="400" fill="#9A9A9A">A quick-access ring for Windows. Summon it with a shortcut, a</text>
<text x="190" y="194" font-size="12" font-weight="400" fill="#9A9A9A">screen corner, or the tray icon, and launch the apps, folders,</text>
<text x="190" y="212" font-size="12" font-weight="400" fill="#9A9A9A">links, and built-in tools you reach for most.</text>
<text x="190" y="236" font-size="12" font-weight="400" fill="#9A9A9A">SwiftX runs entirely on your own device — see Privacy for what</text>
<text x="190" y="254" font-size="12" font-weight="400" fill="#9A9A9A">that means.</text>
<text x="190" y="282" font-size="11" font-weight="700" fill="#3DDCD3" letter-spacing="0.8">TERMS AND CONDITIONS</text>
<text x="380" y="282" font-size="11" font-weight="700" fill="#3DDCD3" letter-spacing="0.8">PRIVACY</text>
<text x="32" y="322" font-size="10" font-weight="600" fill="#3DDCD3" letter-spacing="0.5">Hero card only — SwiftX's About has no spec grid or legal-notices list today, so none is invented here.</text>
<text x="32" y="460" font-size="10" font-weight="400" fill="#6B6B6B">Geometry: 90/* columns, 24px padding, mark 76px — Logi's hero-card format</text>
<text x="32" y="474" font-size="10" font-weight="400" fill="#6B6B6B">(settings-screen-logi-alignment-plan.md Phase 5), unchanged SwiftX copy.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="'Segoe UI',Inter,system-ui,sans-serif" role="img" aria-label="SwiftX - Data Formatter, standalone window invoked from the Ring">
<title>SwiftX - Data Formatter, standalone window invoked from the Ring</title>
<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/></filter></defs>
<rect x="0" y="0" width="980" height="660" rx="10" fill="#121212" stroke="#333333" stroke-width="1.5"/>
<rect x="0" y="0" width="980" height="44" rx="0" fill="#0B0B0B"/>
<text x="18" y="27" font-size="12" font-weight="700" fill="#00DDB3">{ }</text>
<text x="40" y="27" font-size="13" font-weight="600" fill="#FFFFFF">Data Formatter</text>
<text x="964" y="27" font-size="12" font-weight="400" fill="#888888" text-anchor="end">—   □   ✕</text>

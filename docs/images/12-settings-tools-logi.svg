<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="'Segoe UI',Inter,system-ui,sans-serif" role="img" aria-label="SwiftX Settings - Tools panel, card grid">
<title>SwiftX Settings - Tools panel, card grid</title>
<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter></defs>
<rect width="1040" height="620" fill="#141414"/>

<text x="863.5" y="228" font-size="15.5" font-weight="700" fill="#FFFFFF">Certificate</text>
<text x="863.5" y="268" font-size="11" font-weight="400" fill="#9A9A9A">Inspect certificate, PKCS#12</text>
<text x="863.5" y="283" font-size="11" font-weight="400" fill="#9A9A9A">and Java KeyStore files.</text>
<line x1="847.5" y1="322" x2="1008.0" y2="322" stroke="#2E2E2E" stroke-width="1"/>
<text x="927.75" y="346" font-size="11.5" font-weight="700" fill="#3DDCD3" text-anchor="middle" letter-spacing="1">OPEN</text>

<circle cx="705.0" cy="184" r="18" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<text x="705.0" y="188" font-size="10" font-weight="700" fill="#3DDCD3" text-anchor="middle">B64</text>
<rect x="785.5" y="172" width="38" height="20" rx="10.0" fill="#3DDCD3"/>
<circle cx="811.5" cy="182" r="7.5" fill="#141414"/>
<text x="687.0" y="228" font-size="15.5" font-weight="700" fill="#FFFFFF">Base64</text>
<text x="687.0" y="268" font-size="11" font-weight="400" fill="#9A9A9A">Encode and decode</text>
<text x="687.0" y="283" font-size="11" font-weight="400" fill="#9A9A9A">Base64 text.</text>
<line x1="671.0" y1="322" x2="831.5" y2="322" stroke="#2E2E2E" stroke-width="1"/>
<text x="751.25" y="346" font-size="11.5" font-weight="700" fill="#3DDCD3" text-anchor="middle" letter-spacing="1">OPEN</text>
<rect x="847.5" y="150" width="160.5" height="210" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1" filter="url(#sh)"/>
<circle cx="881.5" cy="184" r="18" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<text x="881.5" y="188" font-size="10" font-weight="700" fill="#3DDCD3" text-anchor="middle">CRT</text>
<rect x="962.0" y="172" width="38" height="20" rx="10.0" fill="#2E2E2E"/>

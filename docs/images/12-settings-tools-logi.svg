<text x="510.5" y="268" font-size="11" font-weight="400" fill="#9A9A9A">Store keys and secrets</text>
<text x="510.5" y="283" font-size="11" font-weight="400" fill="#9A9A9A">locally (masked).</text>
<line x1="494.5" y1="322" x2="655.0" y2="322" stroke="#2E2E2E" stroke-width="1"/>
<text x="574.75" y="346" font-size="11.5" font-weight="700" fill="#3DDCD3" text-anchor="middle" letter-spacing="1">OPEN</text>

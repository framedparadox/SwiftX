<text x="318" y="118" font-size="12" font-weight="400" fill="#9A9A9A">Every tool lives inside the Tools item on the ring. Turn one off to take it out.</text>
<rect x="318.0" y="150" width="160.5" height="210" rx="8" fill="#1C1C1C" stroke="#3DDCD3" stroke-width="1.6" filter="url(#sh)"/>
<circle cx="352.0" cy="184" r="18" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<text x="352.0" y="188" font-size="10" font-weight="700" fill="#3DDCD3" text-anchor="middle">{ }</text>
<rect x="432.5" y="172" width="38" height="20" rx="10.0" fill="#3DDCD3"/>
<circle cx="458.5" cy="182" r="7.5" fill="#141414"/>
<text x="334.0" y="228" font-size="15.5" font-weight="700" fill="#FFFFFF">Data Formatter</text>
<text x="334.0" y="268" font-size="11" font-weight="400" fill="#9A9A9A">Auto-detect and format</text>
<text x="334.0" y="283" font-size="11" font-weight="400" fill="#9A9A9A">JSON or XML.</text>

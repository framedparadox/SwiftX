<text x="32" y="249" font-size="11" font-weight="700" fill="#3DDCD3" letter-spacing="1.6">GENERAL</text>
<text x="32" y="293" font-size="11" font-weight="700" fill="#9A9A9A" letter-spacing="1.6">ELEMENTS</text>
<text x="32" y="337" font-size="11" font-weight="700" fill="#9A9A9A" letter-spacing="1.6">TOOLS</text>
<line x1="24" y1="366" x2="246" y2="366" stroke="#2E2E2E" stroke-width="1"/>
<text x="32" y="413" font-size="11" font-weight="700" fill="#9A9A9A" letter-spacing="1.6">FEEDBACK &amp; SUPPORT</text>
<text x="32" y="457" font-size="11" font-weight="700" fill="#9A9A9A" letter-spacing="1.6">PRIVACY &amp; DATA</text>
<text x="32" y="501" font-size="11" font-weight="700" fill="#9A9A9A" letter-spacing="1.6">ABOUT</text>
<text x="318" y="96" font-size="22" font-weight="700" fill="#FFFFFF">General</text>
<rect x="318" y="130" width="658" height="168" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
<text x="334" y="156" font-size="14" font-weight="600" fill="#FFFFFF">Theme</text>
<text x="334" y="174" font-size="11.5" font-weight="400" fill="#9A9A9A">Frosted dark glass (Dark), true black glass (Midnight), or solid white (Light).</text>
<text x="960" y="156" font-size="10" font-weight="600" fill="#3DDCD3" text-anchor="end" letter-spacing="0.4">4 cards — Logi geometry</text>
<rect x="334" y="192" width="160" height="96" rx="6" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<rect x="344" y="202" width="70.0" height="46" rx="3" fill="#E9EEF4"/>
<rect x="414.0" y="202" width="70.0" height="46" rx="3" fill="#141414"/>
<text x="346" y="264" font-size="11" font-weight="400" fill="#6B6B6B">○</text>
<text x="362" y="265" font-size="11.5" font-weight="600" fill="#FFFFFF">System</text>
<rect x="508" y="192" width="160" height="96" rx="6" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<rect x="518" y="202" width="140" height="46" rx="3" fill="#E9EEF4" stroke="#2E2E2E" stroke-width="1"/>
<text x="520" y="264" font-size="11" font-weight="400" fill="#6B6B6B">○</text>
<text x="536" y="265" font-size="11.5" font-weight="600" fill="#FFFFFF">Light</text>
<rect x="682" y="192" width="160" height="96" rx="6" fill="#101010" stroke="#3DDCD3" stroke-width="1.6"/>
<rect x="692" y="202" width="140" height="46" rx="3" fill="#141414" stroke="#2E2E2E" stroke-width="1"/>
<text x="694" y="264" font-size="11" font-weight="400" fill="#3DDCD3">◎</text>
<text x="710" y="265" font-size="11.5" font-weight="600" fill="#FFFFFF">Dark</text>
<rect x="856" y="192" width="160" height="96" rx="6" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<rect x="866" y="202" width="140" height="46" rx="3" fill="#000000" stroke="#2E2E2E" stroke-width="1"/>
<text x="868" y="264" font-size="11" font-weight="400" fill="#6B6B6B">○</text>
<text x="884" y="265" font-size="11.5" font-weight="600" fill="#FFFFFF">Midnight</text>
<rect x="318" y="310" width="658" height="62" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
<circle cx="345" cy="341.0" r="13" fill="none" stroke="#2E2E2E" stroke-width="1"/>
<text x="345" y="344.5" font-size="8.5" font-weight="700" fill="#9A9A9A" text-anchor="middle">AC</text>
<text x="372" y="336" font-size="14" font-weight="600" fill="#FFFFFF">Accent colour</text>
<text x="372" y="353" font-size="11.5" font-weight="400" fill="#9A9A9A">Used for links, toggles, and highlights across Settings.</text>
<circle cx="944" cy="341" r="16" fill="#3DDCD3"/><circle cx="944" cy="341" r="16" fill="none" stroke="#2E2E2E" stroke-width="1.5"/><text x="910" y="330" font-size="9.5" font-weight="600" fill="#3DDCD3" text-anchor="end">flyout: ColorPicker</text>
<rect x="318" y="384" width="658" height="62" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
<circle cx="345" cy="415.0" r="13" fill="none" stroke="#2E2E2E" stroke-width="1"/>
<text x="345" y="418.5" font-size="8.5" font-weight="700" fill="#9A9A9A" text-anchor="middle">LN</text>
<text x="372" y="410" font-size="14" font-weight="600" fill="#FFFFFF">Language</text>
<text x="372" y="427" font-size="11.5" font-weight="400" fill="#9A9A9A">System follows Windows; 19 languages incl. RTL.</text>
<rect x="804" y="396" width="220" height="38" rx="6" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<text x="820" y="420" font-size="12" font-weight="400" fill="#FFFFFF">English (US)</text>
<text x="1008" y="420" font-size="12" font-weight="400" fill="#9A9A9A" text-anchor="end">⌄</text>
<rect x="318" y="458" width="658" height="62" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
<circle cx="345" cy="489.0" r="13" fill="none" stroke="#2E2E2E" stroke-width="1"/>
<text x="345" y="492.5" font-size="8.5" font-weight="700" fill="#9A9A9A" text-anchor="middle">IN</text>
<text x="372" y="484" font-size="14" font-weight="600" fill="#FFFFFF">Invoke</text>
<text x="372" y="501" font-size="11.5" font-weight="400" fill="#9A9A9A">Show or hide the ring from the keyboard.</text>
<rect x="720" y="470" width="150" height="38" rx="6" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<text x="795" y="494" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">Ctrl + Alt + Space</text>
<rect x="882" y="479" width="38" height="20" rx="10.0" fill="#3DDCD3"/>
<circle cx="908" cy="489" r="7.5" fill="#141414"/>
<rect x="318" y="532" width="658" height="62" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
<circle cx="345" cy="563.0" r="13" fill="none" stroke="#2E2E2E" stroke-width="1"/>
<text x="345" y="566.5" font-size="8.5" font-weight="700" fill="#9A9A9A" text-anchor="middle">ST</text>
<text x="372" y="558" font-size="14" font-weight="600" fill="#FFFFFF">Start with Windows</text>
<text x="372" y="575" font-size="11.5" font-weight="400" fill="#9A9A9A">Launch SwiftX when you sign in.</text>
<rect x="944" y="553" width="38" height="20" rx="10.0" fill="#3DDCD3"/>
<circle cx="970" cy="563" r="7.5" fill="#141414"/>
<rect x="318" y="606" width="658" height="62" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
<circle cx="345" cy="637.0" r="13" fill="none" stroke="#2E2E2E" stroke-width="1"/>
<text x="345" y="640.5" font-size="8.5" font-weight="700" fill="#9A9A9A" text-anchor="middle">BK</text>
<text x="372" y="632" font-size="14" font-weight="600" fill="#FFFFFF">Backup &amp; restore</text>
<text x="372" y="649" font-size="11.5" font-weight="400" fill="#9A9A9A">Export or import your ring configuration as JSON.</text>
<rect x="790" y="622" width="100" height="30" rx="6" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<text x="840" y="642" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Export…</text>
<rect x="900" y="622" width="100" height="30" rx="6" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<text x="950" y="642" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Import…</text>
<rect x="318" y="680" width="658" height="78" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
<circle cx="345" cy="719" r="13" fill="none" stroke="#2E2E2E" stroke-width="1"/>
<text x="345" y="722.5" font-size="8.5" font-weight="700" fill="#9A9A9A" text-anchor="middle">RS</text>
<text x="372" y="706" font-size="14" font-weight="600" fill="#FFFFFF">Reset</text>
<text x="372" y="723" font-size="11.5" font-weight="400" fill="#9A9A9A">Restore default theme, accent colour, hover style, item size,</text>
<text x="372" y="738" font-size="11.5" font-weight="400" fill="#9A9A9A">radius, hotkey, tools, and ring items.</text>
<rect x="930" y="704" width="78" height="30" rx="6" fill="#101010" stroke="#2E2E2E" stroke-width="1"/>
<text x="969" y="724" font-size="11.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">Reset</text>
<line x1="318" y1="778" x2="976" y2="778" stroke="#2E2E2E" stroke-width="1"/>
<text x="318" y="800" font-size="10.5" font-weight="400" fill="#6B6B6B">Every control above is real: ThemeBox (shown as 4 cards, Logi's format), AccentColorSwatch,</text>
<text x="318" y="815" font-size="10.5" font-weight="400" fill="#6B6B6B">LanguageBox, HotkeyCapture, StartupToggle, Export/Import, Reset. Only the theme picker</text>
<text x="318" y="830" font-size="10.5" font-weight="400" fill="#6B6B6B">changes shape — Logi renders theme as cards, so this does too.</text>
</svg>

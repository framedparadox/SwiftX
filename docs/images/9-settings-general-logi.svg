<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" font-family="'Segoe UI',Inter,system-ui,sans-serif" role="img" aria-label="SwiftX Settings - General, Logi-format restyle">
<title>SwiftX Settings - General, Logi-format restyle</title>
<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter></defs>
<rect width="1040" height="900" fill="#141414"/>
<rect x="0" y="0" width="1040" height="40" rx="0" fill="#101010"/>
<text x="16" y="25" font-size="12" font-weight="600" fill="#FFFFFF">◉  SwiftX Settings</text>
<text x="1024" y="25" font-size="12" font-weight="400" fill="#9A9A9A" text-anchor="end">—   □   ✕</text>
<rect x="0" y="40" width="270" height="860" rx="0" fill="#101010"/>
<line x1="270" y1="40" x2="270" y2="900" stroke="#2E2E2E" stroke-width="1"/>
<text x="32" y="96" font-size="30" font-weight="700" fill="#FFFFFF">SwiftX</text>
<text x="32" y="130" font-size="30" font-weight="700" fill="#FFFFFF">Settings</text>
<text x="32" y="205" font-size="11" font-weight="700" fill="#9A9A9A" letter-spacing="1.6">HOME</text>

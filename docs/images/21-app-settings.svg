<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" font-family="'Segoe UI',Inter,system-ui,sans-serif" role="img" aria-label="SwiftX - Settings, Logi SettingsPage rail">
<title>SwiftX - Settings, Logi SettingsPage rail</title>

<text x="32" y="381" font-size="11" font-weight="700" fill="#A0A0A0" letter-spacing="1.6">ABOUT</text>
<text x="16" y="880" font-size="9" font-weight="400" fill="#5A5A5A">Back → Home, same Frame.Navigate pattern as Logi's SettingsPage.</text>

<rect x="882" y="515" width="38" height="20" rx="10.0" fill="#8A67FF"/>
<circle cx="908" cy="525" r="7.5" fill="#FFFFFF"/>
<rect x="318" y="568" width="658" height="62" rx="8" fill="#333333" stroke="#444444" stroke-width="1"/>
<circle cx="345" cy="599.0" r="13" fill="none" stroke="#444444" stroke-width="1"/>
<text x="345" y="602.5" font-size="8.5" font-weight="700" fill="#A0A0A0" text-anchor="middle">ST</text>
<text x="372" y="594" font-size="14" font-weight="600" fill="#FFFFFF">Start with Windows</text>
<text x="372" y="611" font-size="11.5" font-weight="400" fill="#A0A0A0">Launch SwiftX when you sign in.</text>
<rect x="944" y="589" width="38" height="20" rx="10.0" fill="#8A67FF"/>
<circle cx="970" cy="599" r="7.5" fill="#FFFFFF"/>
<rect x="318" y="642" width="658" height="62" rx="8" fill="#333333" stroke="#444444" stroke-width="1"/>
<circle cx="345" cy="673.0" r="13" fill="none" stroke="#444444" stroke-width="1"/>
<text x="345" y="676.5" font-size="8.5" font-weight="700" fill="#A0A0A0" text-anchor="middle">BK</text>
<text x="372" y="668" font-size="14" font-weight="600" fill="#FFFFFF">Backup &amp; restore</text>
<text x="372" y="685" font-size="11.5" font-weight="400" fill="#A0A0A0">Export or import your ring configuration as JSON.</text>
<rect x="790" y="658" width="100" height="30" rx="6" fill="#242424" stroke="#444444" stroke-width="1"/>
<text x="840" y="678" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Export…</text>
<rect x="900" y="658" width="100" height="30" rx="6" fill="#242424" stroke="#444444" stroke-width="1"/>
<text x="950" y="678" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">Import…</text>
<rect x="318" y="716" width="658" height="78" rx="8" fill="#333333" stroke="#444444" stroke-width="1"/>
<circle cx="345" cy="755" r="13" fill="none" stroke="#444444" stroke-width="1"/>
<text x="345" y="758.5" font-size="8.5" font-weight="700" fill="#A0A0A0" text-anchor="middle">RS</text>
<text x="372" y="742" font-size="14" font-weight="600" fill="#FFFFFF">Reset</text>
<text x="372" y="759" font-size="11.5" font-weight="400" fill="#A0A0A0">Restore default theme, accent colour, hover style, item size,</text>
<text x="372" y="774" font-size="11.5" font-weight="400" fill="#A0A0A0">radius, hotkey, tools, and ring items.</text>
<rect x="930" y="740" width="78" height="30" rx="6" fill="#242424" stroke="#444444" stroke-width="1"/>
<text x="969" y="760" font-size="11.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">Reset</text>
<line x1="318" y1="814" x2="976" y2="814" stroke="#444444" stroke-width="1"/>
<text x="318" y="836" font-size="10.5" font-weight="400" fill="#808080">SettingsAccentBrush #8A67FF, not SwiftX's teal — the one deliberate colour change from the</text>
<text x="318" y="851" font-size="10.5" font-weight="400" fill="#808080">previous round. Rail simplified to Logi's literal 4 sections: Home/Elements/Tools moved out</text>
<text x="318" y="866" font-size="10.5" font-weight="400" fill="#808080">to their own top-level screens.</text>
</svg>

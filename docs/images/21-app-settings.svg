<text x="372" y="389" font-size="11.5" font-weight="400" fill="#A0A0A0">Used for links, toggles, and highlights across Settings.</text>
<circle cx="944" cy="377" r="16" fill="#8A67FF"/><circle cx="944" cy="377" r="16" fill="none" stroke="#444444" stroke-width="1.5"/><rect x="318" y="420" width="658" height="62" rx="8" fill="#333333" stroke="#444444" stroke-width="1"/>
<circle cx="345" cy="451.0" r="13" fill="none" stroke="#444444" stroke-width="1"/>
<text x="345" y="454.5" font-size="8.5" font-weight="700" fill="#A0A0A0" text-anchor="middle">LN</text>
<text x="372" y="446" font-size="14" font-weight="600" fill="#FFFFFF">Language</text>
<text x="372" y="463" font-size="11.5" font-weight="400" fill="#A0A0A0">System follows Windows; 19 languages incl. RTL.</text>
<rect x="804" y="432" width="220" height="38" rx="6" fill="#242424" stroke="#444444" stroke-width="1"/>
<text x="820" y="456" font-size="12" font-weight="400" fill="#FFFFFF">English (US)</text>
<text x="1008" y="456" font-size="12" font-weight="400" fill="#A0A0A0" text-anchor="end">⌄</text>
<rect x="318" y="494" width="658" height="62" rx="8" fill="#333333" stroke="#444444" stroke-width="1"/>
<circle cx="345" cy="525.0" r="13" fill="none" stroke="#444444" stroke-width="1"/>
<text x="345" y="528.5" font-size="8.5" font-weight="700" fill="#A0A0A0" text-anchor="middle">IN</text>
<text x="372" y="520" font-size="14" font-weight="600" fill="#FFFFFF">Invoke</text>
<text x="372" y="537" font-size="11.5" font-weight="400" fill="#A0A0A0">Show or hide the ring from the keyboard.</text>
<rect x="720" y="506" width="150" height="38" rx="6" fill="#242424" stroke="#444444" stroke-width="1"/>

<rect x="313.5" y="128" width="215.5" height="220" rx="8" fill="#333333" stroke="#444444" stroke-width="1" filter="url(#sh)"/>
<circle cx="347.5" cy="162" r="18" fill="#242424" stroke="#444444" stroke-width="1"/>
<text x="347.5" y="166" font-size="10" font-weight="700" fill="#8A67FF" text-anchor="middle">KEY</text>
<rect x="483.0" y="150" width="38" height="20" rx="10.0" fill="#8A67FF"/>
<circle cx="509.0" cy="160" r="7.5" fill="#FFFFFF"/>
<text x="329.5" y="206" font-size="15.5" font-weight="700" fill="#FFFFFF">Secure values</text>
<text x="329.5" y="246" font-size="11" font-weight="400" fill="#A0A0A0">Store keys and secrets</text>
<text x="329.5" y="261" font-size="11" font-weight="400" fill="#A0A0A0">locally (masked).</text>

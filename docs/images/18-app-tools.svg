<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="'Segoe UI',Inter,system-ui,sans-serif" role="img" aria-label="SwiftX - Tools screen, card grid">
<title>SwiftX - Tools screen, card grid</title>
<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/></filter></defs>
<rect x="0" y="0" width="1040" height="620" rx="0" fill="#2B2B2B"/>
<text x="16" y="21" font-size="10.5" font-weight="500" fill="#8A8A8A">SwiftX</text>
<text x="1026" y="21" font-size="11" font-weight="400" fill="#8A8A8A" text-anchor="end">—   □   ✕</text>
<circle cx="48" cy="66" r="18" fill="none" stroke="#444444" stroke-width="1"/>
<text x="48" y="71" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="middle">←</text>
<text x="78" y="72" font-size="20" font-weight="700" fill="#FFFFFF">Tools</text>
<text x="78" y="92" font-size="11.5" font-weight="400" fill="#A0A0A0">Every tool lives inside the Tools item on the ring, too — opening one here opens it in place.</text>
<rect x="78.0" y="128" width="215.5" height="220" rx="8" fill="#333333" stroke="#8A67FF" stroke-width="1.6" filter="url(#sh)"/>
<circle cx="112.0" cy="162" r="18" fill="#242424" stroke="#444444" stroke-width="1"/>
<text x="112.0" y="166" font-size="10" font-weight="700" fill="#8A67FF" text-anchor="middle">{ }</text>
<rect x="247.5" y="150" width="38" height="20" rx="10.0" fill="#8A67FF"/>
<circle cx="273.5" cy="160" r="7.5" fill="#FFFFFF"/>
<text x="94.0" y="206" font-size="15.5" font-weight="700" fill="#FFFFFF">Data Formatter</text>
<text x="94.0" y="246" font-size="11" font-weight="400" fill="#A0A0A0">Auto-detect and format</text>
<text x="94.0" y="261" font-size="11" font-weight="400" fill="#A0A0A0">JSON or XML.</text>
<line x1="78.0" y1="306" x2="293.5" y2="306" stroke="#444444" stroke-width="1"/>
<text x="185.75" y="333" font-size="11.5" font-weight="700" fill="#8A67FF" text-anchor="middle" letter-spacing="1">OPEN</text>

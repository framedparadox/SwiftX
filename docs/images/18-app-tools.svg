<line x1="784.5" y1="306" x2="1000.0" y2="306" stroke="#444444" stroke-width="1"/>
<text x="892.25" y="333" font-size="11.5" font-weight="700" fill="#8A67FF" text-anchor="middle" letter-spacing="1">OPEN</text>

<circle cx="583.0" cy="162" r="18" fill="#242424" stroke="#444444" stroke-width="1"/>
<text x="583.0" y="166" font-size="10" font-weight="700" fill="#8A67FF" text-anchor="middle">B64</text>
<rect x="718.5" y="150" width="38" height="20" rx="10.0" fill="#8A67FF"/>
<circle cx="744.5" cy="160" r="7.5" fill="#FFFFFF"/>
<text x="565.0" y="206" font-size="15.5" font-weight="700" fill="#FFFFFF">Base64</text>
<text x="565.0" y="246" font-size="11" font-weight="400" fill="#A0A0A0">Encode and decode</text>
<text x="565.0" y="261" font-size="11" font-weight="400" fill="#A0A0A0">Base64 text.</text>
<line x1="549.0" y1="306" x2="764.5" y2="306" stroke="#444444" stroke-width="1"/>
<text x="656.75" y="333" font-size="11.5" font-weight="700" fill="#8A67FF" text-anchor="middle" letter-spacing="1">OPEN</text>
<rect x="784.5" y="128" width="215.5" height="220" rx="8" fill="#333333" stroke="#444444" stroke-width="1" filter="url(#sh)"/>
<circle cx="818.5" cy="162" r="18" fill="#242424" stroke="#444444" stroke-width="1"/>
<text x="818.5" y="166" font-size="10" font-weight="700" fill="#8A67FF" text-anchor="middle">CRT</text>
<rect x="954.0" y="150" width="38" height="20" rx="10.0" fill="#444444"/>

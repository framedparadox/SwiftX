<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="'Segoe UI',Inter,system-ui,sans-serif" role="img" aria-label="SwiftX Tool Window - Data Formatter, Logi-restyled">
<title>SwiftX Tool Window - Data Formatter, Logi-restyled</title>
<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter></defs>

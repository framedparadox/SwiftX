<text x="16" y="25" font-size="12" font-weight="600" fill="#FFFFFF">◉  SwiftX</text>
<text x="1024" y="25" font-size="12" font-weight="400" fill="#888888" text-anchor="end">—  ☐  ✕</text>
<text x="32" y="88" font-size="30" font-weight="700" fill="#FFFFFF">Good Evening</text>
<circle cx="990" cy="73" r="17" fill="none" stroke="#2E2E2E" stroke-width="1"/>
<text x="990" y="78" font-size="16" font-weight="400" fill="#888888" text-anchor="middle">⚙</text>
<circle cx="946" cy="73" r="17" fill="none" stroke="#2E2E2E" stroke-width="1"/>
<text x="946" y="78" font-size="15" font-weight="400" fill="#888888" text-anchor="middle">☽</text>
<text x="32" y="112" font-size="10" font-weight="400" fill="#5A5A5A">GreetingHelper equivalent · 30px Bold · header keeps ONLY theme toggle + gear</text>
<rect x="84.0" y="190" width="268" height="340" rx="10" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1" filter="url(#sh)"/>
<circle cx="218.0" cy="286" r="44" fill="#0F0F0F" stroke="#2E2E2E" stroke-width="1"/>

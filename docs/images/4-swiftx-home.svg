<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" font-family="'Segoe UI',Inter,system-ui,sans-serif" role="img" aria-label="SwiftX Home screen - three navigation boxes">
<title>SwiftX Home screen - three navigation boxes</title>

<text x="218.0" y="514" font-size="12" font-weight="700" fill="#3DDCD3" text-anchor="middle" letter-spacing="1.2">OPEN</text>
<rect x="386.0" y="190" width="268" height="340" rx="10" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1" filter="url(#sh)"/>
<circle cx="520.0" cy="286" r="44" fill="#0F0F0F" stroke="#2E2E2E" stroke-width="1"/>
<text x="520.0" y="298" font-size="36" font-weight="400" fill="#3DDCD3" text-anchor="middle">⚙</text>
<text x="520.0" y="376" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tools</text>
<text x="520.0" y="406" font-size="12" font-weight="400" fill="#888888" text-anchor="middle">Open the built-in developer</text>
<text x="520.0" y="424" font-size="12" font-weight="400" fill="#888888" text-anchor="middle">tools and choose which show</text>
<rect x="481.8" y="446" width="76.4" height="22" rx="11" fill="#242424"/>
<text x="520.0" y="461" font-size="10" font-weight="500" fill="#C8C8C8" text-anchor="middle">4 tools</text>
<rect x="386.0" y="486" width="268" height="1" rx="0" fill="#2E2E2E"/>
<text x="520.0" y="514" font-size="12" font-weight="700" fill="#3DDCD3" text-anchor="middle" letter-spacing="1.2">OPEN</text>
<rect x="688.0" y="190" width="268" height="340" rx="10" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1" filter="url(#sh)"/>
<circle cx="822.0" cy="286" r="44" fill="#0F0F0F" stroke="#2E2E2E" stroke-width="1"/>
<text x="822.0" y="298" font-size="36" font-weight="400" fill="#3DDCD3" text-anchor="middle">▦</text>
<text x="822.0" y="376" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Elements</text>
<text x="822.0" y="406" font-size="12" font-weight="400" fill="#888888" text-anchor="middle">Apps, files, folders, links</text>
<text x="822.0" y="424" font-size="12" font-weight="400" fill="#888888" text-anchor="middle">and groups on the ring</text>
<rect x="740.6" y="446" width="162.8" height="22" rx="11" fill="#242424"/>
<text x="822.0" y="461" font-size="10" font-weight="500" fill="#C8C8C8" text-anchor="middle">add · hide · remove</text>
<rect x="688.0" y="486" width="268" height="1" rx="0" fill="#2E2E2E"/>
<text x="822.0" y="514" font-size="12" font-weight="700" fill="#3DDCD3" text-anchor="middle" letter-spacing="1.2">OPEN</text>
<text x="84.0" y="176" font-size="10" font-weight="600" fill="#3DDCD3" letter-spacing="0.6">PORTRAIT NAV BOX 268×340 · r=10 · box shadow · gutter 34 · footer bar like the Logi card</text>
<text x="32" y="676" font-size="10" font-weight="400" fill="#5A5A5A">Target: SwiftX main shell, Home screen. Replaces the Logi device grid with three navigation boxes.</text>
